# Tauon Music Box configuration file

# This file will be regenerated while app is running. Formatting and additional comments will be lost.
# Tip: Use TOML syntax highlighting

[audio]
use-pipewire = false            # שימוש ב-PipeWire בלבד (בלי PulseAudio)
seek-interval = 15              # שניות דילוג במקלדת (רגיל: 15)
playback-speed = 1.0            # מהירות וטון ניגון (0.1 עד 3.0, רגיל: 1.0)
cross-fade-time = 700           # מילי-שניות להצלבה בין שירים (200-2000, רגיל: 700)
use-pre-roll = false            # השמעת שקט מקדים לסנכרון ה-DAC בפתיחת פלט
pre-roll-time = 8100            # משך שקט מקדים במילי-שניות (100-10000)
device-buffer-ms = 80           # גודל מאגר במילי-שניות (רגיל: 80)
avoid_resampling = false        # מניעת המרת דגימה (FLAC, MP3, OGG, OPUS בלבד)
force-stereo-output = false     # המרת שמע לסטריאו במקום פריסת רמקולים מרובת ערוצים
dsd-direct = false              # שליחת DSD ישיר ל-DAC תואם (ללא המרה ל-PCM)
resample-quality = 1            # איכות דגימה: 0=מיטבית, 1=בינונית, 2=מהירה, 3=מהירה ביותר
cache-limit = 2000              # הגבלת מטמון שמע ברשת (ב-MB)
network-stream = true           # הזרמה ישירה מהזיכרון ללא הורדה מוקדמת של כל הקובץ
stream-buffer-size = 50         # גודל מאגר הזרמה בזיכרון ב-MB (רגיל: 50)
cache-use-tmp = true            # שימוש ב-tmp/ לשמירת מטמון זמני
precache-local-files = false    # שמירת מטמון מקדים גם לקבצים מקומיים וכונני רשת
always-ffmpeg = false           # העדפת פענוח עם FFmpeg (מונע גמגום ב-Raspberry Pi)
volume-curve = 2                # עקומת שמע: 1=ליניארי, 2+=שליטה מדויקת בעוצמות נמוכות
jump-start-dl = true            # התחלת ניגון רצועת רשת מיידית לפני סיום ההורדה

[locale]
display-language = "he"       # שפת ממשק: "he", "en" וכו' (רגיל: "auto")

[search]
separate-multi-genre = false    # הפרדת ז'אנרים מרובים לתוצאות חיפוש נפרדות

[tag-scan]
# השינויים יחולו בעת סריקת תגיות מחדש
artist-display-separator = "; "  # תו מפריד להצגת אמנים מרובים (רגיל: "; ")
artist-split-semicolon = true   # פיצול אמנים לפי נקודה-פסיק עם רווח
artist-split-middle-dot = false  # פיצול אמנים לפי נקודה אמצעית (·)
artist-split-bullet = false     # פיצול אמנים לפי תבליט (•)

[tag-editor]
acoustid-api-key = ""           # מפתח API מותאם לזיהוי AcoustID (ריק = מובנה)
tag-editor-auto-slashes = true  # המרת לוכסן עם רווח למפריד ערכים בעורך התגיות
use_lrc_instead = true          # שמירת מילים מסונכרנות בקובץ LRC חיצוני
save_lyrics_changes_to_files = true  # שמירת עריכת מילים ישירות לתגיות הקובץ
allow_overwrite_synced_with_static = false  # אישור דריסת מילים מסונכרנות במילים רגילות
show_lyrics_save_menu = true    # הצגת חלון אישור בכל שמירת מילים
synced_lyrics_editor_track_end_mode = "repeat"  # פעולה בסיום שיר בעורך מילים: stop, autosave, full save

[playback]
playback-follow-cursor = false  # במעבר קדימה, נגן תמיד את השיר המסומן
back-restarts = false           # לחיצה ראשונה על "הקודם" מפעילה את השיר מחדש
resume-on-advance = true        # בהשהיה, לחיצה על קדימה/אחורה מחדשת ניגון
end-queue-stop = false          # עצירה אוטומטית תמיד בסיום השיר האחרון בתור
block-suspend = false           # מניעת מעבר המחשב למצב שינה בזמן ניגון
allow-video-formats = true      # תמיכה בייבוא סרטוני MP4 ו-WEBM לשמע

[HiDPI]
ui-scale = 1.0                  # קנה מידה של הממשק (מומלץ להגדיל במסכי 4K)
auto-scale = false              # קביעת קנה מידה אוטומטית לפי המסך
tracklist-y-text-offset = 0     # היסט גובה טקסט ברשימת השירים בקנה מידה מותאם

[ui]
theme-name = "Neon Love"
transparent-style = 0           # סגנון שקיפות: 0=כבוי, 1=מראה זכוכית
transparency-tracklist-darkness = 0.0  # כהות רשימת ההשמעה ביחס לשקיפות (0 עד 1)
transparency-intensity = 1.0    # עוצמת שקיפות לוחות הזכוכית (0.5 עד 1.5)
rounded-corners = false         # פינות חלון מעוגלות בעיטור חלון פנימי
rounded-corner-radius = 2       # רדיוס פינות מעוגלות בפיקסלים
mac-style = false               # כפתורי חלון בסגנון macOS
allow-art-zoom = false
scroll-gallery-by-row = false
scroll-gallery-distance = 90    # מרחק גלילת גלריה (כשגלילה לפי שורה כבויה)
scroll-spectrogram = true
mascot-opacity = 40
synced-lyrics-time-offset = -150  # היסט תזמון מילים במילי-שניות (שלילי מקדים)
artist-list-prefers-album-artist = true  # העדפת אמן האלבום ברשימת אמנים (דורש הפעלה מחדש)
sort-ignore-the = true          # התעלמות מ-"The" במיון שמות אמנים
queue-overrides-repeat = true   # השמעת התור בעדיפות על פני מצב חזרה (Repeat)
side-panel-info-persists = false  # הצגת פרטי השיר האחרון בפאנל צד בעצירה
side-panel-info-selected = false  # הצגת פרטי שיר מסומן בפאנל צד בעצירה
side-panel-info-selected-always = false  # Show album art and metadata of selected track at all times. (overrides the above 2 settings)
mini-mode-avoid-notifications = false  # Avoid sending track change notifications when in Mini Mode
hide-queue-when-empty = true
enable-art-header-bar = true    # Show art in top panel when window is narrow
always-art-header-bar = false   # Show art in top panel at any size. (Requires enable-art-header-bar)
side-panel-style = 0            # 0:default, 1:centered
side-panel-left = true
side-lyrics-art = true
side-lyrics-art-on-top = false
showcase-wide-art = false
absolute-track-indices = false  # For playlists with titles disabled only
auto-hide-bottom-title = true   # Hide title in bottom panel when already shown in side panel
auto-show-playing = false       # Show playing track in current playlist on track and playlist change even if not the playing playlist
notify-include-album = true     # Include album name in track change notifications
show-rating-hint = false        # Show playtime hint in stars
drag-tab-to-unpin = true        # Dragging a tab off the top-panel un-pins it

[gallery]
gallery-thin-borders = false
increase-row-spacing = false
gallery-center-text = false

[fonts]
# Changes will require app restart.
use-custom-fonts = false        # Setting to false will reset below settings to default on restart
font-main-standard = "Noto Sans, Noto Sans CJK JP, Arial,"  # Suggested alternate: Liberation Sans
font-main-medium = "Noto Sans, Noto Sans CJK JP, Arial, Medium"
font-main-bold = "Noto Sans, Noto Sans CJK JP, Bold"
font-main-condensed = "Noto Sans, Extra-Condensed"
font-main-condensed-bold = "Noto Sans, Extra-Condensed Bold"

[tracklist]
double-digit-indices = false
column-album-artist-fallsback = false  # 'Album artist' column shows 'artist' if otherwise blank.
column-album-art-full-height = true  # Reserve enough tracklist rows to show column album art without cropping.
left-aligned-album-artist-title = false  # Show 'Album artist' in the folder/album title. Uses colour 'column-album-artist' from theme file
tracklist-scrollbar-left = false  # Position the tracklist scroll bar on the left side instead of the right.
import-auto-sort = false        # This setting is deprecated and will be removed in a future version

[transcode]
sync-bypass-transcode = false   # Don't transcode files with sync function
sync-bypass-low-bitrate = true  # Skip transcode of <=128kbs folders
radio-record-codec = "OPUS"     # Can be OPUS, OGG, FLAC, or MP3. Default: OPUS

[directories]
# יש לציין נתיב מלא למערכת הקבצים
sync-device-music-dir = ""
encode-output-dir = ""          # תיקיית פלט להמרת קבצים (ריק = תיקיית ברירת מחדל)
add_download_directory = ""     # תיקייה נוספת לסריקה ומעקב אוטומטי
playlist_folder_path = ""       # תיקיית ברירת מחדל לרשימות השמעה
autoscan_playlist_folder = false  # ייבוא אוטומטי של רשימות השמעה חדשות מהתיקייה

[app]
enable-remote-interface = false  # הפעלת ממשק שלט רחוק (עבור אפליקציית Android)
release-splash-version = "13.0.0"  # מעקב גרסת מסך פתיחה שהוצגה
use-gamepad = true              # שליטה בממשק באמצעות בקר משחק (שלט)
use-system-tray = false
hide-maximize-button = false
restore-window-position = true  # שמירה ושחזור מיקום החלון במסך בעת פתיחה
mini-mode-always-on-top = true
enable-mpris = true
resume-playback-on-restart = false
resume-playback-on-wake = false
auto-dl-artist-data = true      # הורדה אוטומטית של תמונות אמנים לרשימה
fanart.tv-cover = false
fanart.tv-artist = false
fanart.tv-background = false
auto-update-playlists = false   # עדכון אוטומטי של רשימות השמעה חכמות
write-ratings-to-tag = false    # שמירת דירוג כוכבים לקובץ (MP3, OGG, FLAC בלבד)
enable-discord-rpc = false      # הצגת השיר המתנגן בסטטוס Discord
discord-card-layout = "title_artist"  # פריסה בדיסקורד: כותרת תחילה (title_artist) או אמן (artist_title)
discord-member-list-display = "artist"  # מוצג ברשימת חברים בדיסקורד: song (שיר) או artist (אמן)
discord-clean-title = true      # הסרת סיומות (feat/remix) מהכותרת בדיסקורד
discord-lastfm-button = false   # כפתור פרטי שיר בנוכחות דיסקורד
discord-show-tauon-button = true  # כפתור קישור לאתר Tauon בדיסקורד
discord-keep-idle = false       # השארת סטטוס פעיל בדיסקורד גם בזמן עצירה
discord-litterbox-upload = false  # העלאת עטיפות שירים לרשת להצגה בדיסקורד
auto-search-lyrics = true       # חיפוש מילים אוטומטי ברשת בעת הצגת מילים
search-lyrics = true            # שילוב מילות שירים בחיפוש הראשי (עשוי להאט ספריות ענקיות)
shortcuts-ignore-keymap = false  # מיפוי קיצורי מקשים לפי מיקום פיזי במקלדת
alpha_key_activate_search = true  # הקלדת אות פותחת את שורת החיפוש מיידית
taskbar-status = true           # הצגת התקדמות ניגון בסמל שורת המשימות
taskbar-buttons = true          # כפתורי שליטה בתצוגה מקדימה בשורת המשימות (Windows)

[tokens]
discogs-personal-access-token = ""  # טוקן אישי ל-Discogs להורדת תמונות אמנים
custom-listenbrainz-url = ""    # שרת Listenbrainz מותאם (ריק = ברירת מחדל)
listenbrainz-token = ""

[tauon_satellite]
tau-url = ""                    # Exclude the port

[lastfm]
lastfm-pull-love = false        # Overwrite local love status on scrobble

[scrobbling]
scrobble-radios = true
scrobble-offline-queue = true   # שמירת האזנות ללא אינטרנט ושליחה אוטומטית בהמשך
# תיעוד האזנות משירותי רשת (מומלץ לכבות אם השירות מתעד בעצמו)
scrobble-jellyfin = true
scrobble-tidal = true
scrobble-subsonic = true
scrobble-plex = true

[maloja_account]
maloja-url = ""                 # כתובת שרת Maloja פרטי (למשל http://localhost:32400)
maloja-key = ""                 # מפתח API לשירות Maloja
maloja-enable = false

[plex_account]
plex-username = ""              # כתובת הדוא"ל לחשבון PLEX
plex-password = ""              # סיסמת חשבון PLEX
plex-servername = ""            # שם שרת ה-PLEX ברשת

[subsonic_account]
subsonic-username = ""
subsonic-password = ""
subsonic-password-plain = false
subsonic-generator-cache = false
subsonic-server-url = "http://localhost:4040"

[jellyfin_account]
jelly-username = ""
jelly-password = ""
jelly-server-url = "http://localhost:8096"  # כתובת ופורט של שרת Jellyfin (IP:Port)

[network]
stream-bitrate = 0              # קצב סיביות (Bitrate) לקידוד מחדש ב-Subsonic (0 = ללא המרה)

[listenalong]
broadcast-page-port = 7590      # שינוי נכנס לתוקף בהפעלה מחדש של הנגן

[chart]
chart-columns = 3
chart-rows = 3
chart-uses-text = true
chart-sorts-top-played = true
chart-font = "Monospace 10"     # גופן וגודל לתרשים (למשל Monospace 10)

